# Durable local service. Six workers are directories inside one container.
# docker compose -f deploy/compose/docker-compose.yml up --build
name: mammoth
services:
  mammoth:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - local-data:/data
    init: true
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  local-data:
