# Supported local-service settings on AI_coded.
# Use --local-root /path/to/store; the simulated workers share that filesystem.
# Environment values override this file: MAMMOTH_STORAGE__REPLICATION=2

[storage]
block_size = "128MiB"
replication = 3
inline_threshold = "1MiB"

[read]
cache_size = "256MiB" # 0 disables the verified memory cache; not an OS cache flush

[compute]
memory_budget = "128MiB" # Per-job accounting target, not a process RSS limit
spill_directory = "" # System temp, or an existing directory with enough free space

[gateway]
ui_listen = "127.0.0.1:8080"
s3_listen = "127.0.0.1:9000"

[security]
tls = "off" # TLS/authentication are not implemented; other values fail at startup
auth = "none"
