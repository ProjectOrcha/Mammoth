[licenses]
# Mozilla certificate data used by rustls through webpki-roots.
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[advisories]
yanked = "deny"
# The legacy Ratatui 0.28 UI still uses this build-time macro. The advisory
# reports unmaintained status, not a known vulnerability; upgrade that UI separately.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "Legacy Ratatui build-time paste dependency; terminal UI upgrade tracked separately" }]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
