[licenses]
# Mozilla certificate data used by rustls through webpki-roots.
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[advisories]
yanked = "deny"
# Ratatui 0.28 uses this build-time macro. Its removal requires Ratatui 0.30
# (Rust >=1.86), beyond the guide's Rust 1.85 MSRV. This advisory is about
# maintenance, not a known vulnerability. Revisit when raising the MSRV.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "Ratatui build-time paste dependency; retain Rust 1.85 compatibility" }]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
