[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[advisories]
yanked = "deny"
# Match the AI_coded policy for the shared legacy Ratatui 0.28 dependency.
# This advisory is unmaintained status, not a known vulnerability.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "Legacy Ratatui build-time paste dependency; terminal UI upgrade tracked separately" }]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
