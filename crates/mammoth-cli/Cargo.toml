[package]
name        = "mammoth-cli"
description = "Durable context memory for coding agents — the `mammoth` binary"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[[bin]]
name = "mammoth"
path = "src/main.rs"

[dependencies]
mammoth-mcp = { path = "../mammoth-mcp" }
mammoth-core  = { workspace = true }
mammoth-local = { workspace = true }
mammoth-bench = { workspace = true }
mammoth-viz   = { workspace = true }

clap        = { workspace = true }
comfy-table = { workspace = true }
owo-colors  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }

mammoth-migrate = { workspace = true }
mammoth-compute = { workspace = true }
mammoth-gateway = { workspace = true }
mammoth-client = { workspace = true }
mammoth-storage = { workspace = true }
futures-util = { workspace = true }
fs2 = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }
crc32c = { workspace = true }
clap_complete = "4"
serde_yaml = "0.9"
csv = "1"
toml = "0.8"

[dev-dependencies]
