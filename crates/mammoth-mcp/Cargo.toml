[package]
name = "mammoth-mcp"
description = "Mammoth MCP server for durable coding-agent context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mammoth-memory = { path = "../mammoth-memory", version = "0.1.0" }
rmcp = { version = "=3.4.0", features = ["transport-io"] }
schemars = "1"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.4.0", features = ["client", "transport-child-process"] }
