name: CI

on:
  push:
    branches: [main, AI_coded]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Clippy with actionable annotations
        shell: bash
        run: |
          if cargo clippy --workspace --all-targets --all-features --locked > clippy.log 2>&1; then
            cat clippy.log
          else
            cat clippy.log
            python3 - <<'PYREPORT'
          from pathlib import Path
          report = "\n".join(Path("clippy.log").read_text().splitlines()[-60:])
          report = report.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Clippy failed::{report}")
          PYREPORT
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - uses: taiki-e/install-action@nextest
      - name: Workspace tests with failure details
        shell: bash
        run: |
          if cargo nextest run --workspace --all-features --locked --no-fail-fast > nextest.log 2>&1; then
            cat nextest.log
          else
            cat nextest.log
            python3 - <<'PYREPORT'
          from pathlib import Path
          import re
          report = re.sub(r"\x1b\[[0-9;]*m", "", Path("nextest.log").read_text(errors="replace"))
          lines = report.splitlines()
          failures = {}
          for i, line in enumerate(lines):
              if "panicked at" in line:
                  key = re.sub(r"\(\d+\)", "(process)", line)
                  failures.setdefault(key, "\n".join(part[:500] for part in lines[i:i + 8]))
          report = "\n\n".join(failures.values()) if failures else "\n".join(lines[-120:])
          report = report[-20000:]
          # GitHub truncates individual annotations; keep each detail below 4 KiB.
          for offset in range(0, len(report), 2500):
              part = report[offset:offset + 2500]
              part = part.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Workspace tests failed (part {offset // 2500 + 1})::{part}")
          PYREPORT
            exit 1
          fi
      - run: cargo test --workspace --doc --locked
      - run: cargo test -p mammoth-parts --examples --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs-drift:
    # The committed CLI reference must match the clap tree. See Part XIII.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask docs
      - name: Fail if the CLI reference is stale
        run: git diff --exit-code -- web/src/content/docs/cli/reference.md

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - working-directory: ui
        run: npm ci && npm audit --audit-level=moderate && npm run check && npm test && npm run build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npm run build
      - working-directory: web
        run: npm run build
        env:
          SITE_URL: https://projectorcha.github.io
          BASE_PATH: /Mammoth

  benchmark-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m unittest discover -s bench-suite/compare -p 'test_*.py'
      - run: python3 bench-suite/compare/publish.py
      - run: python3 bench-suite/publish.py
      - name: Check published snapshots match the raw evidence
        run: git diff --exit-code -- docs/BENCHMARKS.md docs/BENCHMARKS-LEGACY.md bench-suite/results web/public/benchmarks ui/static/benchmarks ui/src/lib/data
