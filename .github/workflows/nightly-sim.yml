name: Nightly simulation

# 10,000 deterministic seeds. Any failure files an issue carrying the seed, so
# the bug reproduces exactly:
#   MAMMOTH_SIM_SEED=<seed> cargo nextest run --test sim
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
    inputs:
      seeds:
        description: How many seeds to run
        default: '10000'

permissions: { contents: read, issues: write }

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Run seeds
        id: sim
        run: |
          SEEDS="${{ github.event.inputs.seeds || '10000' }}"
          for i in $(seq 1 "$SEEDS"); do
            SEED=$RANDOM$RANDOM
            if ! MAMMOTH_SIM_SEED=$SEED cargo nextest run --test sim --no-fail-fast; then
              echo "failing_seed=$SEED" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done

      - name: File an issue with the seed
        if: failure() && steps.sim.outputs.failing_seed != ''
        uses: actions/github-script@v7
        with:
          script: |
            const seed = '${{ steps.sim.outputs.failing_seed }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `sim: failure on seed ${seed}`,
              labels: ['bug', 'simulation'],
              body: [
                'The nightly simulation run failed.',
                '',
                'Reproduce:',
                '```bash',
                `MAMMOTH_SIM_SEED=${seed} cargo nextest run --test sim`,
                '```',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
