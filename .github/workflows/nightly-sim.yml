name: Nightly simulation

# 10,000 deterministic seeds of the in-memory GFS teaching model.
# A failed assertion records its seed in the job log; reproduce with:
#   MAMMOTH_SIM_SEED=<seed> cargo nextest run --test sim
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
    inputs:
      seeds:
        description: How many seeds to run
        default: '10000'

permissions: { contents: read, issues: write }

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Detect the simulation harness
        id: harness
        shell: bash
        run: |
          ready=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; packages=json.load(sys.stdin)["packages"]; print(str(any(t["name"] == "sim" and "test" in t["kind"] for p in packages for t in p["targets"])).lower())')
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "Simulation harness is planned; no seeds run until the sim target exists."
          fi

      - name: Run seeds
        id: sim
        if: steps.harness.outputs.ready == 'true'
        env:
          MAMMOTH_SIM_COUNT: ${{ github.event.inputs.seeds || '10000' }}
          MAMMOTH_SIM_SEED: '1'
        run: |
          if ! cargo test --locked -p mammoth-testkit --test sim -- --nocapture > simulation.log 2>&1; then
            cat simulation.log
            python3 -c 'import os,re; text=open("simulation.log").read(); match=re.search(r"failing_seed=(\d+)", text); open(os.environ["GITHUB_OUTPUT"], "a").write("failing_seed="+match.group(1)+"\n") if match else None'
            exit 1
          fi
          cat simulation.log

      - name: File an issue with the seed
        if: failure() && steps.sim.outputs.failing_seed != ''
        uses: actions/github-script@v7
        env:
          FAILING_SEED: ${{ steps.sim.outputs.failing_seed }}
        with:
          script: |
            const seed = process.env.FAILING_SEED;
            if (!/^\d+$/.test(seed)) throw new Error('Invalid simulation seed');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `sim: failure on seed ${seed}`,
              labels: ['bug', 'simulation'],
              body: [
                'The nightly GFS teaching-model simulation failed.',
                '',
                'Reproduce:',
                '```bash',
                `MAMMOTH_SIM_SEED=${seed} cargo test --locked -p mammoth-testkit --test sim`,
                '```',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
