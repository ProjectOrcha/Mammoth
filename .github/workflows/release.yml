name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mammoth
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mammoth
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mammoth.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Build dashboard and binary
        shell: bash
        run: |
          cargo fmt --all --check
          cargo xtask build-ui
          npm --prefix ui run check
          npm --prefix ui test
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p mammoth-parts --examples --locked
          cargo build --release --locked -p mammoth-cli --target '${{ matrix.target }}'
      - name: Package
        shell: bash
        run: |
          cargo xtask package '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mammoth-${{ matrix.target }}
          path: target/dist/mammoth-${{ matrix.target }}.tar.gz*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: packages, merge-multiple: true }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-release-draft.txt; then
            if [ "$(cat existing-release-draft.txt)" != "true" ]; then
              echo "Refusing to replace assets on a published release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" packages/*.tar.gz packages/*.sha256 --clobber
